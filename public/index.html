<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06070a" />
  <meta name="description" content="OmniDash — панель управления серверами: логин, выдача серверов, доступы, порты, лимиты и сроки." />
  <meta name="color-scheme" content="dark" />
  <title>OmniDash</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="boot" style="min-height:100vh;display:grid;place-items:center;text-align:center">
    <div>
      <div style="width:46px;height:46px;border-radius:13px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(150deg,#8b96ff,#5b6cff 55%,#2f3bcc);box-shadow:0 10px 30px rgba(91,108,255,.35)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 3 7v10l9 5 9-5V7Z"/><path d="m3 7 9 5 9-5M12 12v10"/>
        </svg>
      </div>
      <div style="font-weight:700;letter-spacing:-.02em;font-size:17px">OmniDash</div>
      <div style="margin-top:6px;color:#646d81;font-size:12px">загружаем панель…</div>
      <div style="width:120px;height:3px;border-radius:99px;background:rgba(255,255,255,.08);margin:16px auto 0;overflow:hidden">
        <div style="width:40%;height:100%;border-radius:inherit;background:#7c8cff;animation:bootslide 1.1s ease-in-out infinite"></div>
      </div>
      <style>@keyframes bootslide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}</style>
    </div>
  </div>
  <noscript>
    <div style="padding:40px;text-align:center;color:#e9ecf4;font-family:sans-serif">
      Для панели OmniDash нужен JavaScript. Включите его в браузере и обновите страницу.
    </div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
